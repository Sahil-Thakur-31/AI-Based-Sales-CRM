<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexCRM — Sales Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f;
  --bg2: #0d0e1a;
  --bg3: #141525;
  --bg4: #1c1d30;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #c8ff57;
  --accent2: #57d9ff;
  --accent3: #ff6b8a;
  --accent4: #a78bff;
  --text: #eeeef8;
  --text2: #b0b0c8;
  --muted: #5a5a78;
  --card: rgba(255,255,255,0.035);
  --card2: rgba(255,255,255,0.06);
  --success: #4fffb0;
  --warning: #ffc14a;
  --danger: #ff6b6b;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:13px;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  min-height:100vh;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(200,255,87,0.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(200,255,87,0.018) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;z-index:0;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* LAYOUT */
.app{display:flex;height:100vh;position:relative;z-index:1;}

/* LOGIN SCREEN */
#loginScreen{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.login-box{
  width:420px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:40px;
  animation:fadeUp .5s ease;
}
.login-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:28px;
  color:var(--accent);letter-spacing:-1px;margin-bottom:4px;
}
.login-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
.login-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;}
.login-input{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  font-family:'DM Mono',monospace;font-size:13px;color:var(--text);
  outline:none;transition:border-color .2s;margin-bottom:16px;
}
.login-input:focus{border-color:var(--accent);}
.role-select{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;
}
.role-btn{
  padding:10px 8px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);cursor:pointer;text-align:center;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);
  transition:all .15s;
}
.role-btn.sel{background:rgba(200,255,87,0.1);border-color:var(--accent);color:var(--accent);}
.btn-login{
  width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#000;
  cursor:pointer;transition:all .15s;
}
.btn-login:hover{background:#d4ff6a;transform:translateY(-1px);}

/* SIDEBAR */
.sidebar{
  width:210px;flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;
}
.logo{padding:22px 18px 16px;border-bottom:1px solid var(--border);}
.logo-mark{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-.5px;}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.role-indicator{
  margin-top:8px;display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:20px;font-size:9px;font-weight:500;
  background:rgba(200,255,87,0.1);color:var(--accent);border:1px solid rgba(200,255,87,0.2);
}

.nav-wrap{padding:8px 10px;flex:1;}
.nav-section-label{
  font-size:9px;text-transform:uppercase;letter-spacing:2px;
  color:var(--muted);padding:10px 6px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 8px;
  border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text2);
  transition:all .12s;margin-bottom:1px;user-select:none;
}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:rgba(200,255,87,0.1);color:var(--accent);}
.nav-item.hidden{display:none;}
.nav-icon{font-size:13px;width:16px;text-align:center;}
.nav-badge{
  margin-left:auto;padding:1px 5px;border-radius:20px;
  font-size:9px;font-weight:600;background:var(--accent3);color:#fff;
}
.nav-badge.green{background:var(--accent);color:#000;}

.sidebar-user{
  padding:12px 14px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:9px;cursor:pointer;
}
.user-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:#000;flex-shrink:0;
}
.user-name{font-size:11px;font-weight:500;}
.user-role{font-size:9px;color:var(--muted);}
.logout-btn{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;}
.logout-btn:hover{color:var(--accent3);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{
  padding:14px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:rgba(7,8,15,0.85);backdrop-filter:blur(12px);flex-shrink:0;
}
.page-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-box{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);
  outline:none;width:180px;transition:border-color .2s;
}
.search-box:focus{border-color:var(--accent);}
.search-box::placeholder{color:var(--muted);}
.notif-btn{
  width:32px;height:32px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;position:relative;
}
.notif-dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent3);border:1px solid var(--bg);}

/* CONTENT AREA */
.content-area{flex:1;overflow-y:auto;padding:24px 28px;}

/* BUTTONS */
.btn{
  padding:7px 14px;border-radius:var(--radius-sm);font-family:'DM Mono',monospace;
  font-size:12px;cursor:pointer;border:none;transition:all .12s;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-accent{background:var(--accent);color:#000;}
.btn-accent:hover{background:#d4ff6a;transform:translateY(-1px);}
.btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-danger{background:rgba(255,107,107,0.15);color:var(--danger);border:1px solid rgba(255,107,107,0.2);}
.btn-danger:hover{background:rgba(255,107,107,0.25);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-blue{background:rgba(87,217,255,0.1);color:var(--accent2);border:1px solid rgba(87,217,255,0.2);}
.btn-blue:hover{background:rgba(87,217,255,0.2);}
.btn-purple{background:rgba(167,139,255,0.1);color:var(--accent4);border:1px solid rgba(167,139,255,0.2);}
.btn-purple:hover{background:rgba(167,139,255,0.2);}

/* CARDS / PANELS */
.panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:18px;
  animation:fadeUp .4s ease both;
}
.panel-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.panel-meta{font-size:10px;color:var(--muted);margin-left:auto;}
.panel-body{padding:18px;}
.panel-body.np{padding:0;}

/* GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.grid23{display:grid;grid-template-columns:2fr 1fr;gap:18px;}

/* KPI CARDS */
.kpi-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;
  animation:fadeUp .4s ease both;
}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent));}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;}
.kpi-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;}
.kpi-change{font-size:10px;margin-top:5px;}
.kpi-up{color:var(--success);}
.kpi-down{color:var(--accent3);}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
  padding:10px 14px;text-align:left;font-weight:400;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.tbl td{padding:11px 14px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.03);}
.tbl tbody tr{transition:background .1s;cursor:pointer;}
.tbl tbody tr:hover td{background:rgba(255,255,255,0.02);}
.tbl tbody tr:last-child td{border-bottom:none;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;}
.badge-dot{width:5px;height:5px;border-radius:50%;}
.badge-hot{background:rgba(255,107,138,0.15);color:var(--accent3);}
.badge-warm{background:rgba(255,193,74,0.15);color:var(--warning);}
.badge-cold{background:rgba(87,217,255,0.1);color:var(--accent2);}
.badge-won{background:rgba(79,255,176,0.12);color:var(--success);}
.badge-lost{background:rgba(255,107,107,0.12);color:var(--danger);}
.badge-open{background:rgba(200,255,87,0.1);color:var(--accent);}
.badge-new{background:rgba(167,139,255,0.1);color:var(--accent4);}
.badge-pending{background:rgba(255,193,74,0.12);color:var(--warning);}
.badge-approved{background:rgba(79,255,176,0.12);color:var(--success);}

.stage-pill{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:20px;font-size:10px;font-weight:500;
}

/* CHIP */
.ai-chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:20px;background:rgba(200,255,87,0.08);border:1px solid rgba(200,255,87,0.18);
  color:var(--accent);font-size:10px;font-weight:500;
}

/* FORM ELEMENTS */
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px;display:block;}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--text);
  outline:none;transition:border-color .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-select option{background:var(--bg3);}
.form-textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:500;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-backdrop.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:14px;
  width:90%;max-width:620px;max-height:85vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .2s;
  box-shadow:var(--shadow);
}
.modal-backdrop.open .modal{transform:translateY(0);}
.modal-lg{max-width:860px;}
.modal-sm{max-width:420px;}
.modal-header{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;position:sticky;top:0;
  background:var(--bg2);z-index:1;
}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.modal-close{
  margin-left:auto;width:28px;height:28px;border-radius:6px;background:var(--card);
  border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--text2);transition:all .12s;
}
.modal-close:hover{color:var(--accent3);border-color:var(--accent3);}
.modal-body{padding:22px;}
.modal-footer{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--bg2);
}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{
  padding:9px 16px;font-size:11px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.toggle-wrap:last-child{border:none;}
.toggle-label{font-size:12px;color:var(--text2);}
.toggle{
  width:38px;height:20px;border-radius:10px;background:var(--bg4);
  cursor:pointer;position:relative;transition:background .2s;border:1px solid var(--border);
}
.toggle.on{background:var(--accent);}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;background:#000;transition:left .2s;
}
.toggle.on::after{left:20px;background:#000;}

/* STAT ROW */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border:none;}
.stat-name{font-size:11px;color:var(--text2);}
.stat-val{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;}

/* PROGRESS */
.prog-track{background:rgba(255,255,255,0.06);border-radius:3px;height:4px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .8s ease;}

/* PIPELINE VISUAL */
.pipeline-vis{display:flex;gap:0;height:44px;border-radius:8px;overflow:hidden;margin-bottom:12px;}
.p-stage{
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:9px;cursor:pointer;
  transition:filter .15s;
}
.p-stage:hover{filter:brightness(1.3);}

/* CHART BARS */
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:80px;}
.cb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.cb-fill{width:100%;border-radius:3px 3px 0 0;background:var(--accent);opacity:.7;cursor:pointer;transition:opacity .2s;}
.cb-fill:hover{opacity:1;}
.cb-label{font-size:9px;color:var(--muted);}

/* DONUT */
.donut-wrap{position:relative;width:90px;height:90px;margin:0 auto 10px;}
.donut-wrap svg{transform:rotate(-90deg);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-pct{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.donut-sub{font-size:9px;color:var(--muted);}

/* LEGEND */
.legend{display:flex;flex-direction:column;gap:5px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* LIST ITEMS */
.list-item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--border);
}
.list-item:last-child{border:none;padding-bottom:0;}
.li-icon{
  width:30px;height:30px;border-radius:7px;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
}
.li-title{font-size:12px;font-weight:500;margin-bottom:2px;}
.li-meta{font-size:10px;color:var(--muted);}
.li-right{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);white-space:nowrap;}

/* OCR DROP ZONE */
.ocr-zone{
  border:2px dashed var(--border2);border-radius:var(--radius);
  padding:28px;text-align:center;cursor:pointer;transition:all .2s;
  background:var(--bg3);
}
.ocr-zone:hover,.ocr-zone.drag{border-color:var(--accent);background:rgba(200,255,87,0.04);}
.ocr-icon{font-size:28px;margin-bottom:8px;}
.ocr-text{font-size:11px;color:var(--muted);}
.ocr-result{
  margin-top:14px;padding:14px;background:var(--bg4);border-radius:var(--radius-sm);
  border:1px solid var(--border);display:none;
}
.ocr-result.show{display:block;}
.ocr-field{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;}
.ocr-field:last-child{border:none;}
.ocr-key{color:var(--muted);}
.ocr-val{color:var(--accent);font-weight:500;}

/* AI SEARCH */
.ai-search-panel{
  background:rgba(200,255,87,0.03);border:1px solid rgba(200,255,87,0.12);
  border-radius:var(--radius);padding:18px;margin-bottom:16px;
}
.ai-source-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.source-chip{
  padding:4px 10px;border-radius:20px;font-size:10px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .12s;
}
.source-chip.sel{background:rgba(200,255,87,0.1);border-color:var(--accent);color:var(--accent);}

.ai-lead-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
  animation:fadeUp .3s ease both;
}
.al-score{
  width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:'Syne',sans-serif;
  font-weight:800;font-size:14px;flex-shrink:0;
}
.al-info{flex:1;}
.al-company{font-size:13px;font-weight:600;margin-bottom:3px;}
.al-meta{font-size:10px;color:var(--muted);}

/* EXPENSE STATS */
.expense-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}

/* SETTINGS CRUD */
.crud-list{display:flex;flex-direction:column;gap:6px;}
.crud-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
}
.crud-item-name{flex:1;font-size:12px;}
.crud-item-meta{font-size:10px;color:var(--muted);}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:40px;color:var(--muted);
}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-text{font-size:12px;}

/* SEARCHING ANIMATION */
.searching{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:30px;color:var(--accent);font-size:12px;
}
.dot-pulse{display:flex;gap:4px;}
.dot-pulse span{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s ease-in-out infinite;
}
.dot-pulse span:nth-child(2){animation-delay:.2s;}
.dot-pulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,60%,100%{transform:scale(.6);opacity:.4;}30%{transform:scale(1);opacity:1;}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* PAGE */
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}

/* TAGS INPUT */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:20px;background:rgba(200,255,87,0.1);border:1px solid rgba(200,255,87,0.2);
  color:var(--accent);font-size:10px;
}
.tag-remove{cursor:pointer;opacity:.7;}
.tag-remove:hover{opacity:1;}

/* CONFIRM */
.confirm-box{text-align:center;padding:10px;}
.confirm-icon{font-size:36px;margin-bottom:12px;}
.confirm-msg{font-size:13px;color:var(--text2);margin-bottom:4px;}
.confirm-sub{font-size:11px;color:var(--muted);}

/* NOTIFICATION TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 18px;font-size:12px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);animation:fadeUp .3s ease;max-width:320px;
}
.toast-icon{font-size:16px;}

/* PIPELINE STAGES DETAIL */
.pipeline-stage-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.pipeline-stage-row:last-child{border:none;}
.ps-label{width:30px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--accent);}
.ps-bar-wrap{flex:1;}
.ps-bar{height:6px;border-radius:3px;transition:width .6s ease;}
.ps-count{font-size:11px;color:var(--muted);width:80px;text-align:right;}

/* DETAIL VIEW */
.detail-section{margin-bottom:20px;}
.detail-section-title{
  font-family:'Syne',sans-serif;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.detail-item{}
.detail-key{font-size:10px;color:var(--muted);margin-bottom:2px;}
.detail-val{font-size:12px;color:var(--text);}

/* ACTIVITY TIMELINE */
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{
  position:absolute;left:-17px;top:3px;width:10px;height:10px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg2);
}
.tl-time{font-size:9px;color:var(--muted);margin-bottom:2px;}
.tl-text{font-size:11px;color:var(--text2);}

/* STATUS INDICATOR */
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}

/* RESPONSIVE SCROLL FIX */
.scroll-x{overflow-x:auto;}

/* Deal Stage Colors */
.s-p1{background:rgba(90,90,160,0.3);}
.s-p2{background:rgba(60,100,160,0.4);}
.s-p3{background:rgba(40,120,130,0.4);}
.s-p4{background:rgba(100,160,60,0.3);}
.s-p5{background:rgba(140,200,50,0.35);}
.s-p6{background:rgba(180,230,40,0.4);}
.s-p7{background:rgba(200,255,87,0.5);}

.sp1{color:#8a8adc;}
.sp2{color:#6aacdc;}
.sp3{color:#4adcc0;}
.sp4{color:#8adc4a;}
.sp5{color:#b0dc30;}
.sp6{color:#d0e840;}
.sp7{color:var(--accent);}

/* SEGMENTED BAR */
.seg-bar{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:16px;overflow-x:auto;flex-wrap:nowrap;gap:2px;}
.seg-btn{padding:6px 14px;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;color:var(--muted);border:none;background:transparent;transition:all .15s;white-space:nowrap;}
.seg-btn.active{background:var(--accent);color:#000;font-weight:700;}
.seg-btn:hover:not(.active){color:var(--text);background:var(--card2);}
/* QUOTE ITEM ROW */
.quote-item-row{display:grid;grid-template-columns:2fr 60px 90px 60px 60px 80px 28px;gap:5px;align-items:center;margin-bottom:5px;}
.quote-item-total{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;color:var(--accent);text-align:center;padding:0 4px;}
/* FILTER BAR */
.filter-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.filter-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
/* GREEN BTN */
.btn-green{background:rgba(79,255,176,0.1);color:var(--success);border:1px solid rgba(79,255,176,0.2);}
.btn-green:hover{background:rgba(79,255,176,0.2);}
.btn-warning{background:rgba(255,193,74,0.1);color:var(--warning);border:1px solid rgba(255,193,74,0.2);}
.btn-warning:hover{background:rgba(255,193,74,0.2);}

// ========== LOGIN ==========
let selectedRole = 'admin';
function selectRole(el) {
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  selectedRole = el.dataset.role;
}
function doLogin() {
  const name = document.getElementById('loginName').value.trim() || 'User';
  currentUser = { name, role: selectedRole };
  currentRole = selectedRole;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  buildNav();
  updateUserDisplay();
  navigate('dashboard');
}
function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}
function updateUserDisplay() {
  const u = currentUser;
  const initials = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRoleLabel').textContent = u.role.charAt(0).toUpperCase()+u.role.slice(1);
  document.getElementById('roleIndicator').textContent = '◈ ' + u.role.charAt(0).toUpperCase()+u.role.slice(1);
}

// ========== NAV BUILD ==========
function buildNav() {
  const config = NAV_CONFIG[currentRole] || NAV_CONFIG.salesperson;
  let html = '';
  config.forEach(section => {
    html += `<div class="nav-section-label">${section.section}</div>`;
    section.items.forEach(item => {
      const badge = item.badge ? item.badge() : 0;
      const badgeHtml = badge > 0 ? `<span class="nav-badge ${item.badgeClass||''}">${badge}</span>` : '';
      html += `<div class="nav-item" data-page="${item.id}" onclick="navigate('${item.id}',this)">
        <span class="nav-icon">${item.icon}</span>${item.label}${badgeHtml}
      </div>`;
    });
  });
  document.getElementById('navWrap').innerHTML = html;
}
function refreshNav() { buildNav(); }

// ========== NAVIGATION ==========
function navigate(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else { const found = document.querySelector(`[data-page="${page}"]`); if(found) found.classList.add('active'); }
  const titles = { dashboard:'Dashboard', forecast:'Sales Forecasting', deals:'Deals', leads:'Leads Management', quotations:'Quotations', clients:'Client Directory', ai_leads:'AI Generated Leads', followups:'Follow-ups', meetings:'Meetings', events:'Events', expenses:'Expenses', reports:'Reports', performance:'Team Performance', settings:'Settings' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  renderPage(page);
}

// ========== HELPERS ==========
function fmtMoney(n) { if(n>=10000000) return '₹'+( n/10000000).toFixed(2)+'Cr'; if(n>=100000) return '₹'+(n/100000).toFixed(1)+'L'; if(n>=1000) return '₹'+(n/1000).toFixed(0)+'K'; return '₹'+n; }
function fmtDate(d) { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function getUser(id) { return STATE.users.find(u=>u.id===id)||{name:'Unknown'}; }
function getIndustry(id) { return STATE.industries.find(i=>i.id===id)||{name:id}; }
function getSource(id) { return STATE.sources.find(s=>s.id===id)||{name:id}; }
function getClient(id) { return STATE.clients.find(c=>c.id===id)||{name:'Unknown'}; }
function riskColor(r) { return r==='low'?'var(--success)':r==='medium'?'var(--warning)':'var(--danger)'; }
function stageColor(s) { const m={P1:'#6a6acc',P2:'#5aaab0',P3:'#4ac8a0',P4:'#90cc50',P5:'#c0d840',P6:'#d8e830',P7:'var(--accent)'}; return m[s]||'var(--muted)'; }
function stageBg(s) { const m={P1:'rgba(106,106,204,0.2)',P2:'rgba(90,170,176,0.2)',P3:'rgba(74,200,160,0.2)',P4:'rgba(144,204,80,0.2)',P5:'rgba(192,216,64,0.2)',P6:'rgba(216,232,48,0.2)',P7:'rgba(200,255,87,0.25)'}; return m[s]||'rgba(255,255,255,0.05)'; }
function uid() { return 'id_'+Math.random().toString(36).slice(2,10); }
function myTeamIds() {
  if(currentRole==='admin') return STATE.users.map(u=>u.id);
  if(currentRole==='manager') return STATE.users.filter(u=>u.managerId===currentUser.id||u.id===currentUser.id).map(u=>u.id);
  return [currentUser.id];
}
function showToast(msg, type='success') {
  const icons = { success:'✓', error:'✕', info:'ℹ', warning:'⚠' };
  const colors = { success:'var(--success)', error:'var(--danger)', info:'var(--accent2)', warning:'var(--warning)' };
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="toast-icon" style="color:${colors[type]}">${icons[type]}</span>${msg}`;
  t.style.display = 'flex';
  t.style.borderColor = colors[type]+'44';
  setTimeout(()=>{ t.style.display='none'; }, 2800);
}

// ========== MODAL ==========
function openModal(title, bodyHtml, footerHtml='', size='') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  if(footerHtml) { footer.innerHTML = footerHtml; footer.style.display='flex'; }
  else { footer.style.display='none'; }
  const modal = document.getElementById('modal');
  modal.className = 'modal'+(size?' modal-'+size:'');
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
function closeModalOnBackdrop(e) { if(e.target===document.getElementById('modalBackdrop')) closeModal(); }

// ========== RENDER ENGINE ==========
function renderPage(page) {
  const ca = document.getElementById('contentArea');
  const renderers = {
    dashboard: renderDashboard,
    forecast: renderForecast,
    deals: renderDeals,
    leads: renderLeads,
    clients: renderClients,
    ai_leads: renderAILeads,
    followups: renderFollowups,
    meetings: renderMeetings,
    events: renderEvents,
    expenses: renderExpenses,
    quotations: renderQuotations,
    reports: renderReports,
    performance: renderPerformance,
    settings: renderSettings,
  };
  if(renderers[page]) { ca.innerHTML = renderers[page](); if(page==='settings'){setTimeout(()=>bindSettingToggles(),20);} }
  else { ca.innerHTML = `<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">Page under construction</div></div>`; }
  // Run post-render hooks
  if(page==='settings') bindSettingToggles();
}

function convertLeadToDeal(leadId) {
  const l = STATE.leads.find(x=>x.id===leadId);
  if(!l) return;
  // Create client if not exists
  let clientId = STATE.clients.find(c=>c.name===l.company)?.id;
  if(!clientId) {
    clientId = uid();
    STATE.clients.push({
      id: clientId, name: l.company, industry: l.industry,
      address: l.address||'', employees: l.employees||0,
      turnover: l.turnover||'N/A', website: l.website||'', source: l.source,
      dealCount: 0, gst: '', location: '', createdBy: STATE.users[0].id, createdAt: new Date().toISOString().slice(0,10),
    });
    showToast(`${l.company} added to Clients`);
  }
  // Create deal
  const dealId = uid();
  STATE.deals.push({
    id: dealId, client: clientId, clientName: l.company,
    assignedTo: l.assignedTo, stage: 'P1', value: l.estimatedValue,
    probability: 20, expectedClose: '', actualClose: null,
    status: 'open', aiRisk: 'medium', leadId, createdAt: new Date().toISOString().slice(0,10),
  });
  l.convertedToDeal = true; l.status = 'converted';
  closeModal(); showToast(`Lead converted to Deal! Company added as Client.`,'success');
  renderPage('leads'); refreshNav();
}

function openOCRModal(context) {
  const sampleData = context==='lead' 
    ? { company:'Infosys BPM Ltd', industry:'IT/SaaS', contact:'Vikram Nair', phone:'+91 98765 43210', email:'vikram.nair@infosys.com', website:'infosysbpm.com', address:'Electronic City, Bangalore' }
    : { vendor:'The Oberoi Mumbai', date:'2025-03-18', amount:'8,500', gst:'1,530', total:'10,030', category:'Client Meeting' };

  const body = `
  <div class="ocr-zone" id="ocrZone" onclick="simulateOCR('${context}')">
    <div class="ocr-icon">📄</div>
    <div style="font-size:13px;font-weight:500;margin-bottom:4px">Drop file or click to upload</div>
    <div class="ocr-text">Supports: Business card, receipt, document (JPG, PNG, PDF)</div>
    <div style="margin-top:10px"><span class="ai-chip">✦ AI OCR Processing</span></div>
  </div>
  <div class="ocr-result" id="ocrResult">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="color:var(--success);font-size:14px">✓</span>
      <span style="font-size:11px;color:var(--text2)">OCR Extraction Complete — Review and confirm</span>
    </div>
    ${Object.entries(sampleData).map(([k,v])=>`
    <div class="ocr-field">
      <span class="ocr-key">${k.charAt(0).toUpperCase()+k.slice(1)}</span>
      <span class="ocr-val">${v}</span>
    </div>`).join('')}
  </div>
  <div id="ocrProcessing" style="display:none">
    <div class="searching"><div class="dot-pulse"><span></span><span></span><span></span></div>Processing document with AI OCR...</div>
  </div>`;
  const footer = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-accent" id="ocrImportBtn" style="display:none" onclick="importOCRData('${context}')">Import ${context==='lead'?'as Lead':'Expense'}</button>`;
  openModal(context==='lead'?'📷 OCR Lead Import':'📷 OCR Expense Import', body, footer);
}
function simulateOCR(context) {
  document.getElementById('ocrZone').style.display='none';
  document.getElementById('ocrProcessing').style.display='block';
  setTimeout(()=>{
    document.getElementById('ocrProcessing').style.display='none';
    document.getElementById('ocrResult').classList.add('show');
    document.getElementById('ocrImportBtn').style.display='inline-flex';
  }, 1800);
}
function importOCRData(context) {
  if(context==='lead') {
    STATE.leads.push({ id:uid(), company:'Infosys BPM Ltd', industry:'i1', employees:50000, turnover:'₹5000Cr+', address:'Electronic City, Bangalore', source:'s1', temperature:'warm', estimatedValue:2000000, assignedTo:'u2', status:'new', convertedToDeal:false, lastContact:new Date().toISOString().slice(0,10), nextAction:'Initial contact', createdAt:new Date().toISOString().slice(0,10) });

// EVENTS (Role-based)
// ============================
function renderEvents() {
  if(currentRole==='admin') return renderEventsAdmin();
  return renderEventsUser();
}
function renderEventsAdmin() {
  function evRow(ev) {
    var going = (ev.registrations||[]).filter(function(r){return r.status==='approved';}).length;
    var pend = (ev.interested||[]).filter(function(r){return r.status==='pending';}).length;
    var sc = ev.aiScore>=85?'var(--accent)':ev.aiScore>=70?'var(--accent2)':'var(--muted)';
    var pendCell = pend
      ? `<span class="badge badge-pending" style="cursor:pointer" onclick="viewEventPending('${ev.id}')">${pend} pending</span>`
      : '<span style="font-size:10px;color:var(--muted)">None</span>';
    return `<tr>
      <td><div style="font-weight:500">${ev.name}</div><div style="font-size:10px;color:var(--muted)">${ev.venue}</div></td>
      <td>${fmtDate(ev.startDate)}</td>
      <td style="color:${sc}"><strong>${ev.aiScore}</strong></td>
      <td><span class="badge badge-${ev.status==='upcoming'?'open':'won'}">${ev.status}</span></td>
      <td><span class="badge badge-approved" style="cursor:pointer" onclick="viewEventAttendees('${ev.id}')">${going} attending</span></td>
      <td>${pendCell}</td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm btn-ghost" onclick="viewEventDetail('${ev.id}')">View</button>
        <button class="btn btn-sm btn-blue" onclick="openEventModal('${ev.id}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteEvent('${ev.id}')">Del</button>
      </td>
    </tr>`;
  }
  return `
<div class="panel">
  <div class="panel-header">
    <div class="panel-title">Events &mdash; Admin View</div>
    <div class="ai-chip">&#10022; AI Scored</div>
    <button class="btn btn-accent btn-sm" onclick="openEventModal()" style="margin-left:auto">+ Add Event</button>
  </div>
  <div class="panel-body np scroll-x">
    <table class="tbl">
      <thead><tr><th>Event</th><th>Dates</th><th>AI Score</th><th>Status</th><th>Going</th><th>Pending</th><th>Actions</th></tr></thead>
      <tbody>${STATE.events.map(evRow).join('')}</tbody>
    </table>
  </div>
</div>`;
}

function renderEventsUser() {
  var isMgr = currentRole==='manager';
  function evRow(ev) {
    var myReg = (ev.registrations||[]).find(function(r){return r.userId===currentUser.id;});
    var myInt = (ev.interested||[]).find(function(r){return r.userId===currentUser.id;});
    var teamPend = (ev.interested||[]).filter(function(r){return r.status==='pending';}).length;
    var sb = '<span style="font-size:10px;color:var(--muted)">Not marked</span>';
    if(myReg) sb = myReg.status==='approved'
      ? '<span class="badge badge-approved">&#10003; Approved</span>'
      : '<span class="badge badge-pending">Pending Reg.</span>';
    else if(myInt) {
      if(myInt.status==='pending') sb = '<span class="badge badge-pending">Interest Sent</span>';
      else if(myInt.status==='declined') sb = '<span class="badge badge-declined">Declined</span>';
      else sb = '<span class="badge badge-approved">Approved</span>';
    }
    var canMark = ev.status==='upcoming' && !myReg && !myInt;
    var sc = ev.aiScore>=85?'var(--accent)':ev.aiScore>=70?'var(--accent2)':'var(--muted)';
    var actions = '';
    if(canMark) actions += `<button class="btn btn-sm btn-blue" onclick="markInterest('${ev.id}')">&#9733; Interested</button> `;
    if(isMgr && teamPend>0) actions += `<button class="btn btn-sm btn-warning" onclick="viewEventPending('${ev.id}')">Review ${teamPend}</button>`;
    return `<tr>
      <td><div style="font-weight:500">${ev.name}</div></td>
      <td>${getIndustry(ev.industry).name}</td>
      <td>${ev.venue}</td>
      <td>${fmtDate(ev.startDate)}</td>
      <td style="color:${sc}"><strong>${ev.aiScore}</strong></td>
      <td>${ev.expectedROI}</td>
      <td><span class="badge badge-${ev.status==='upcoming'?'open':'won'}">${ev.status}</span></td>
      <td>${sb}</td>
      <td style="white-space:nowrap">${actions}</td>
    </tr>`;
  }
  return `
<div class="panel">
  <div class="panel-header">
    <div class="panel-title">Industry Events</div>
    <div class="ai-chip">&#10022; AI Scored</div>
  </div>
  <div class="panel-body np scroll-x">
    <table class="tbl">
      <thead><tr><th>Event</th><th>Industry</th><th>Venue</th><th>Dates</th><th>AI Score</th><th>ROI Est.</th><th>Status</th><th>My Status</th><th>Action</th></tr></thead>
      <tbody>${STATE.events.map(evRow).join('')}</tbody>
    </table>
  </div>
</div>`;
}

function markInterest(evId) {
  const ev=STATE.events.find(x=>x.id===evId);if(!ev)return;
  if(!ev.interested)ev.interested=[];
  if(ev.interested.find(r=>r.userId===currentUser.id)){showToast('Already marked interest','warning');return;}
  ev.interested.push({userId:currentUser.id,status:'pending'});
  renderPage('events');showToast('Interest marked! Awaiting manager approval.');
}
function viewEventAttendees(evId) {
  const ev=STATE.events.find(x=>x.id===evId);if(!ev)return;
  const going=(ev.registrations||[]).filter(r=>r.status==='approved');
  openModal(`Attendees — ${ev.name}`,`
  <div style="margin-bottom:12px"><span class="badge badge-approved">${going.length} confirmed attending</span></div>
  <table class="tbl"><thead><tr><th>Name</th><th>Role</th></tr></thead><tbody>
    ${going.map(r=>{const u=getUser(r.userId);return`<tr><td>${u.name}</td><td><span class="badge badge-open">${u.role}</span></td></tr>`;}).join('')}
    ${going.length===0?'<tr><td colspan="2" style="text-align:center;color:var(--muted)">No approved attendees</td></tr>':''}
  </tbody></table>`);
}
function viewEventPending(evId) {
  const ev=STATE.events.find(x=>x.id===evId);if(!ev)return;
  const pend=(ev.interested||[]).filter(r=>r.status==='pending');
  openModal(`Pending Approvals — ${ev.name}`,`
  <table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Actions</th></tr></thead><tbody>
    ${pend.map(r=>{const u=getUser(r.userId);return`<tr><td>${u.name}</td><td>${u.role}</td>
    <td style="white-space:nowrap">
      <button class="btn btn-sm btn-green" onclick="approveEventInterest('${evId}','${r.userId}')">✓ Approve</button>
      <button class="btn btn-sm btn-danger" onclick="declineEventInterest('${evId}','${r.userId}')">✕ Decline</button>
    </td></tr>`;}).join('')}
    ${pend.length===0?'<tr><td colspan="3" style="text-align:center;color:var(--muted)">No pending requests</td></tr>':''}
  </tbody></table>`);
}
function approveEventInterest(evId,userId) {
  const ev=STATE.events.find(x=>x.id===evId);if(!ev)return;
  const req=(ev.interested||[]).find(r=>r.userId===userId);
  if(req){req.status='approved';if(!ev.registrations)ev.registrations=[];ev.registrations.push({userId,status:'approved'});ev.interested=ev.interested.filter(r=>r.userId!==userId);}
  closeModal();renderPage('events');showToast('Approved! User added to attendees.');
}
function declineEventInterest(evId,userId) {
  const ev=STATE.events.find(x=>x.id===evId);if(!ev)return;
  const req=(ev.interested||[]).find(r=>r.userId===userId);if(req)req.status='declined';
  closeModal();renderPage('events');showToast('Request declined','warning');
}
function viewEventDetail(id) {

    <div class="detail-item"><div class="detail-key">Venue</div><div class="detail-val">${ev.venue}</div></div>
    <div class="detail-item"><div class="detail-key">Industry</div><div class="detail-val">${getIndustry(ev.industry).name}</div></div>

function openEventModal(id) {

function saveEvent(id) {

function deleteEvent(id) { STATE.events=STATE.events.filter(e=>e.id!==id);renderPage('events');showToast('Event deleted','error'); }

// ============================
// EXPENSES (Role-based)
// ============================
function renderExpenses() {
  let exps = STATE.expenses;
  if(currentRole==='salesperson') exps = exps.filter(e=>e.userId===currentUser.id);
  else if(currentRole==='manager') exps = exps.filter(e=>myTeamIds().includes(e.userId));

  const total = exps.reduce((a,e)=>a+e.total,0);
  const approved = exps.filter(e=>e.status==='approved');
  const pending = exps.filter(e=>e.status==='pending');
  const byCat = {};
  exps.forEach(e=>{ byCat[e.category]=(byCat[e.category]||0)+e.total; });
  const maxCat = Math.max(...Object.values(byCat),1);

  const filterBar = currentRole==='admin' ? `
  <div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="btn btn-sm btn-accent" onclick="filterExpenses('all',this)">All Users</button>
    ${STATE.users.filter(u=>u.role!=='admin').map(u=>`<button class="btn btn-sm btn-ghost" onclick="filterExpenses('${u.id}',this)">${u.name.split(' ')[0]}</button>`).join('')}
  </div>` : currentRole==='manager' ? `
  <div class="filter-bar">
    <span class="filter-label">Filter:</span>
    <button class="btn btn-sm btn-accent" onclick="filterExpenses('team',this)">My Team</button>
    ${STATE.users.filter(u=>myTeamIds().includes(u.id)).map(u=>`<button class="btn btn-sm btn-ghost" onclick="filterExpenses('${u.id}',this)">${u.name.split(' ')[0]}</button>`).join('')}
  </div>` : '';

  return `
<div class="grid4" style="margin-bottom:16px">
  <div class="kpi-card" style="--kc:var(--accent)"><div class="kpi-label">Total</div><div class="kpi-value">${fmtMoney(total)}</div><div class="kpi-change">Q1 2025</div></div>
  <div class="kpi-card" style="--kc:var(--success)"><div class="kpi-label">Approved</div><div class="kpi-value">${fmtMoney(approved.reduce((a,e)=>a+e.total,0))}</div><div class="kpi-change">${approved.length} expenses</div></div>
  <div class="kpi-card" style="--kc:var(--warning)"><div class="kpi-label">Pending</div><div class="kpi-value">${fmtMoney(pending.reduce((a,e)=>a+e.total,0))}</div><div class="kpi-change kpi-down">${pending.length} awaiting</div></div>
  <div class="kpi-card" style="--kc:var(--accent3)"><div class="kpi-label">GST</div><div class="kpi-value">${fmtMoney(exps.reduce((a,e)=>a+e.gst,0))}</div><div class="kpi-change">Claimable</div></div>
</div>
<div class="grid2" style="margin-bottom:16px">
  <div class="panel"><div class="panel-header"><div class="panel-title">By Category</div></div><div class="panel-body">
    ${Object.entries(byCat).map(([cat,val],i)=>{
      const cols=['var(--accent)','var(--accent2)','var(--warning)','var(--accent3)','var(--accent4)'];
      return `<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="color:var(--text2)">${cat.replace('_',' ')}</span><span style="color:${cols[i%5]}">${fmtMoney(val)}</span></div><div class="prog-track"><div class="prog-fill" style="width:${Math.round(val/maxCat*100)}%;background:${cols[i%5]}"></div></div></div>`;
    }).join('')}
  </div></div>
  <div class="panel"><div class="panel-header"><div class="panel-title">By User</div></div><div class="panel-body">
    ${(currentRole==='salesperson'?[getUser(currentUser.id)]:STATE.users.filter(u=>currentRole==='admin'?u.role!=='admin':myTeamIds().includes(u.id))).map((u,i)=>{
      const uAmt = exps.filter(e=>e.userId===u.id).reduce((a,e)=>a+e.total,0);
      const pct = total?Math.round(uAmt/total*100):0;
      const cols=['var(--accent)','var(--accent2)','var(--warning)','var(--accent3)'];
      return `<div class="stat-row"><span class="stat-name">${u.name}</span><div style="text-align:right"><span class="stat-val">${fmtMoney(uAmt)}</span><div class="prog-track" style="width:90px;margin-top:3px"><div class="prog-fill" style="width:${pct}%;background:${cols[i%4]}"></div></div></div></div>`;
    }).join('')}
  </div></div>
</div>
<div class="panel">
  <div class="panel-header">
    <div class="panel-title">Expense Ledger</div>
    ${filterBar}
    <button class="btn btn-purple btn-sm" onclick="openOCRModal('expense')">📷 OCR</button>
    <button class="btn btn-accent btn-sm" onclick="openExpenseModal()">+ Log Expense</button>
  </div>
  <div class="panel-body np scroll-x" id="expTableWrap">${renderExpenseTable(exps)}</div>
</div>`;
}
function renderExpenseTable(exps) {
  if(!exps.length) return `<div class="empty-state"><div class="empty-icon">💰</div><div class="empty-text">No expenses found</div></div>`;
  return `<table class="tbl"><thead><tr><th>Category</th><th>User</th><th>Amount</th><th>GST</th><th>Total</th><th>Date</th><th>Description</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${exps.map(e=>`<tr>
      <td>${e.category.replace('_',' ')}</td>
      <td>${getUser(e.userId).name}</td>
      <td>${fmtMoney(e.amount)}</td>
      <td>${fmtMoney(e.gst)}</td>
      <td>${fmtMoney(e.total)}</td>
      <td>${fmtDate(e.date)}</td>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${e.description}">${e.description}</td>
      <td><span class="badge badge-${e.status==='approved'?'approved':e.status==='pending'?'pending':'lost'}">${e.status}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-sm btn-ghost" onclick="viewExpense('${e.id}')">View</button>
        ${(currentRole==='admin'||(currentRole==='manager'&&myTeamIds().includes(e.userId)))&&e.status==='pending'?`<button class="btn btn-sm btn-green" onclick="approveExpense('${e.id}')">✓ Approve</button>`:''}
        ${currentRole==='admin'?`<button class="btn btn-sm btn-danger" onclick="deleteExpense('${e.id}')">Del</button>`:''}
      </td>
    </tr>`).join('')}
  </tbody></table>`;
}
function filterExpenses(filter, el) {
  document.querySelectorAll('.filter-bar .btn').forEach(b=>{b.className='btn btn-sm btn-ghost';});
  el.className='btn btn-sm btn-accent';
  let exps = STATE.expenses;
  if(filter==='all') exps = STATE.expenses;
  else if(filter==='team') exps = STATE.expenses.filter(e=>myTeamIds().includes(e.userId));
  else exps = STATE.expenses.filter(e=>e.userId===filter);
  document.getElementById('expTableWrap').innerHTML = renderExpenseTable(exps);
}
function viewExpense(id) {
  const e=STATE.expenses.find(x=>x.id===id);if(!e)return;
  openModal(`Expense — ${e.category}`,`<div class="detail-grid">
    <div class="detail-item"><div class="detail-key">Category</div><div class="detail-val">${e.category.replace('_',' ')}</div></div>
    <div class="detail-item"><div class="detail-key">User</div><div class="detail-val">${getUser(e.userId).name}</div></div>
    <div class="detail-item"><div class="detail-key">Amount</div><div class="detail-val">${fmtMoney(e.amount)}</div></div>

// Initialize counters from existing data
STATE.dealQuoteCounters = {};
STATE.leadQuoteCounters = {};
STATE.quotations.forEach(q=>{
  if(q.dealId){
    const n=parseInt((q.quoteNumber||'').split('-').pop())||0;
    STATE.dealQuoteCounters[q.dealId]=Math.max(STATE.dealQuoteCounters[q.dealId]||0,n);
  } else if(q.leadId){
    const n=parseInt((q.quoteNumber||'').split('-').pop())||0;
    STATE.leadQuoteCounters[q.leadId]=Math.max(STATE.leadQuoteCounters[q.leadId]||0,n);
  }
});

function nextQuoteNumber(dealId, leadId) {
  if(dealId) {
    STATE.dealQuoteCounters[dealId]=(STATE.dealQuoteCounters[dealId]||0)+1;
    return 'QT-D'+dealId.replace(/\D/g,'').padStart(3,'0')+'-'+String(STATE.dealQuoteCounters[dealId]).padStart(3,'0');
  }
  if(leadId) {
    STATE.leadQuoteCounters[leadId]=(STATE.leadQuoteCounters[leadId]||0)+1;
    return 'QT-L'+leadId.replace(/\D/g,'').padStart(3,'0')+'-'+String(STATE.leadQuoteCounters[leadId]).padStart(3,'0');
  }
  return 'QT-'+Date.now();
}

function buildQuoteItemRows() {
  return _quoteItems.map((it,i)=>`
  <div class="quote-item-row" id="qir_${i}">
    <select class="form-select" style="font-size:11px" onchange="qiProductSel(${i},this)">
      ${STATE.products.map(p=>`<option value="${p.id}"${it.productId===p.id?' selected':''}>${p.name}</option>`).join('')}
    </select>
    <input class="form-input" type="number" min="1" value="${it.qty}" style="text-align:center" oninput="qiField(${i},'qty',this.value)">
    <input class="form-input" type="number" value="${it.unitPrice}" style="text-align:right" oninput="qiField(${i},'unitPrice',this.value)">
    <input class="form-input" type="number" value="${it.discountPct||0}" min="0" max="100" style="text-align:center" oninput="qiField(${i},'discountPct',this.value)">
    <input class="form-input" type="number" value="${it.taxPct}" min="0" max="100" style="text-align:center" oninput="qiField(${i},'taxPct',this.value)">
    <div class="quote-item-total" id="qit_${i}">${fmtMoney(it.net||0)}</div>
    <button class="btn btn-sm btn-danger" style="padding:3px 7px" onclick="removeQI(${i})">✕</button>
  </div>`).join('');
}
function addQuoteItem() {
  const p = STATE.products[0];
  const sub = p.price, tax = Math.round(p.price*(p.taxPercent||18)/100);
  _quoteItems.push({productId:p.id,qty:1,discountPct:0,taxPct:p.taxPercent||18,unitPrice:p.price,subtotal:sub,tax,net:sub+tax});
  document.getElementById('quoteItemsList').innerHTML = buildQuoteItemRows();
  recalcQuoteTotals();
}
function removeQI(i) {
  _quoteItems.splice(i,1);
  document.getElementById('quoteItemsList').innerHTML = buildQuoteItemRows();
  recalcQuoteTotals();
}
function qiProductSel(i, sel) {
  const p = getProduct(sel.value);
  _quoteItems[i].productId = sel.value;
  _quoteItems[i].unitPrice = p.price;
  _quoteItems[i].taxPct = p.taxPercent||18;
  calcQIRow(i);
  document.getElementById('quoteItemsList').innerHTML = buildQuoteItemRows();
  recalcQuoteTotals();
}
function qiField(i, field, val) {
  _quoteItems[i][field] = parseFloat(val)||0;
  calcQIRow(i);
  const el = document.getElementById('qit_'+i);
  if(el) el.textContent = fmtMoney(_quoteItems[i].net||0);
  recalcQuoteTotals();
}
function calcQIRow(i) {
  const it = _quoteItems[i];
  const base = (it.unitPrice||0)*(it.qty||1);
  const disc = base*((it.discountPct||0)/100);
  const sub = base - disc;
  const tax = sub*((it.taxPct||0)/100);
  it.subtotal = sub; it.tax = tax; it.net = sub+tax;
}
function recalcQuoteTotals() {
  _quoteItems.forEach((_,i)=>calcQIRow(i));
  const sub = _quoteItems.reduce((a,it)=>a+(it.subtotal||0),0);
  const tax = _quoteItems.reduce((a,it)=>a+(it.tax||0),0);
  const disc = parseFloat(document.getElementById('qm_disc')?.value)||0;
  const total = sub+tax-disc;
  const el_s=document.getElementById('qs_sub'), el_t=document.getElementById('qs_tax'), el_g=document.getElementById('qs_total');
  if(el_s) el_s.textContent = fmtMoney(sub);
  if(el_t) el_t.textContent = fmtMoney(tax);
  if(el_g) el_g.textContent = fmtMoney(total);
}
function saveQuote(id) {
  const dealId = document.getElementById('qm_deal').value||null;
  const leadId = document.getElementById('qm_lead').value||null;
  _quoteItems.forEach((_,i)=>calcQIRow(i));
  const sub = _quoteItems.reduce((a,it)=>a+(it.subtotal||0),0);
  const tax = _quoteItems.reduce((a,it)=>a+(it.tax||0),0);
  const disc = parseFloat(document.getElementById('qm_disc').value)||0;
  const gt = sub+tax-disc;
  const clientName = document.getElementById('qm_client').value;
  const existQ = id?STATE.quotations.find(q=>q.id===id):null;
  const qNum = id?existQ.quoteNumber:nextQuoteNumber(dealId,leadId);
  const data = {
    id:id||uid(), quoteNumber:qNum, dealId, leadId, clientId:'', clientName,
    createdBy:currentUser.id, assignedTo:currentUser.id,
    quoteDate:document.getElementById('qm_date').value,
    validUntil:document.getElementById('qm_valid').value,
    items:JSON.parse(JSON.stringify(_quoteItems)),
    subtotal:sub, taxAmount:tax, discountAmount:disc, grandTotal:gt,
    status:document.getElementById('qm_stat').value,
    version:id?(existQ.version||1)+1:1,
    notes:document.getElementById('qm_notes').value
  };
  if(id){const i=STATE.quotations.findIndex(q=>q.id===id);if(i>=0)STATE.quotations[i]={...STATE.quotations[i],...data};}
  else STATE.quotations.push(data);
  closeModal();renderPage('quotations');showToast(id?'Quotation updated':'Quotation created');
}
function deleteQuote(id) { STATE.quotations=STATE.quotations.filter(q=>q.id!==id);renderPage('quotations');showToast('Deleted','error'); }
function getProduct(id) { return STATE.products.find(p=>p.id===id)||{name:'Unknown',price:0,taxPercent:18}; }

function renderPerformance() {
  let visible = PERF_DATA;
  if(currentRole==='salesperson') visible = PERF_DATA.filter(p=>p.uid===currentUser.id);
  else if(currentRole==='manager') visible = PERF_DATA.filter(p=>myTeamIds().includes(p.uid));

  const filterUI = currentRole==='admin' ? `
  <div class="filter-bar" style="margin-bottom:14px">
    <span class="filter-label">View:</span>
    <button class="btn btn-sm btn-accent" id="pf_all" onclick="filterPerf('all',this)">Overall</button>

  <div class="filter-bar" style="margin-bottom:14px">
    <span class="filter-label">View:</span>
    <button class="btn btn-sm btn-accent" onclick="filterPerf('team',this)">My Team</button>

${filterUI}
<div class="grid4" style="margin-bottom:16px">

  <div class="kpi-card" style="--kc:var(--accent2)"><div class="kpi-label">Deals Closed</div><div class="kpi-value">${visible.reduce((a,p)=>a+p.closed,0)}</div><div class="kpi-change kpi-up">↑ vs target</div></div>
  <div class="kpi-card" style="--kc:var(--warning)"><div class="kpi-label">Avg Win Rate</div><div class="kpi-value">${avgWin}%</div><div class="kpi-change kpi-up">↑ 5% QoQ</div></div>
  <div class="kpi-card" style="--kc:var(--accent4)"><div class="kpi-label">Bonus Earned</div><div class="kpi-value">${fmtMoney(totBonus)}</div><div class="kpi-change">Q1 2025</div></div>
</div>
<div class="panel">

function buildPerfTable(data) {
  if(!data.length) return '<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">No data</div></div>';
  return `<table class="tbl"><thead><tr><th>Name</th><th>Role</th><th>Deals Closed</th><th>Revenue</th><th>Win Rate</th><th>Followup Rate</th><th>Pipeline</th><th>Bonus</th></tr></thead><tbody>
    ${data.map(p=>{
      const u = getUser(p.uid);
      return `<tr>
        <td><div style="font-weight:500">${p.name}</div></td>
        <td><span class="badge badge-${u.role==='manager'?'open':'new'}">${u.role}</span></td>
        <td>${p.closed}</td>
        <td>${fmtMoney(p.rev)}</td>
        <td style="color:${p.win>=75?'var(--success)':p.win>=60?'var(--warning)':'var(--danger)'}">${p.win}%<div class="prog-track" style="width:70px;margin-top:3px"><div class="prog-fill" style="width:${p.win}%;background:${p.win>=75?'var(--success)':p.win>=60?'var(--warning)':'var(--danger)'}"></div></div></td>
        <td style="color:${p.fu>=80?'var(--success)':p.fu>=65?'var(--warning)':'var(--danger)'}">${p.fu}%</td>
        <td>${fmtMoney(p.pip)}</td>
        <td style="color:${p.bonus>0?'var(--accent)':'var(--muted)'};font-weight:${p.bonus>0?'700':'400'}">${p.bonus>0?fmtMoney(p.bonus):'—'}</td>
      </tr>`;
    }).join('')}
  </tbody></table>`;
}
function filterPerf(filter, el) {
  document.querySelectorAll('.filter-bar .btn').forEach(b=>b.className='btn btn-sm btn-ghost');
  el.className='btn btn-sm btn-accent';
  let data = PERF_DATA;
  if(filter==='all') data = PERF_DATA;
  else if(filter==='team') data = PERF_DATA.filter(p=>myTeamIds().includes(p.uid));
  else data = PERF_DATA.filter(p=>p.uid===filter);
  document.getElementById('perfTableWrap').innerHTML = buildPerfTable(data);
}

let _settingTab = 'crm';

function renderSettings() {
  const isAdmin = currentRole==='admin';
  const tabs = isAdmin ? ['crm','roles','industries','sources','products','users'] : ['crm'];
  const tabLabels = {crm:'⚙ CRM & Integrations',roles:'Roles',industries:'Industries',sources:'Sources',products:'Products',users:'Users'};
  return `
<div class="seg-bar" id="settingsSegBar">

</div>
<div id="settingContent">${renderSettingTabContent('crm')}</div>`;
}

function switchSettingTab(tab, el) {
  document.querySelectorAll('#settingsSegBar .seg-btn').forEach(b=>b.classList.remove('active'));

  if(tab==='products') return renderCRUDTable('products','Product',['Name:name','Category:category','Price:price','Tax%:taxPercent']);

  return '';
}

// CRUD TABLE
function renderCRUDTable(type, singular, colDefs) {
  const cols = colDefs.map(c=>c.split(':'));
  const renderVal = (item, field) => {
    if(field==='color') return `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${item[field]};margin-right:5px;vertical-align:middle"></span>${item[field]}`;
    if(field==='isAutoFetch') return item[field]?'<span class="badge badge-approved">Yes</span>':'<span class="badge badge-declined">No</span>';
    if(field==='price') return fmtMoney(item[field]||0);
    if(field==='taxPercent') return (item[field]||0)+'%';
    return item[field]||'—';
  };
  return `
<div class="panel">
  <div class="panel-header">
    <div class="panel-title">${singular}s</div>
    <button class="btn btn-accent btn-sm" onclick="openCRUDModal('${type}','${singular}')">+ Add ${singular}</button>
  </div>
  <div class="panel-body np scroll-x">
    <table class="tbl">
      <thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}<th>Actions</th></tr></thead>
      <tbody id="crud_tbody_${type}">
        ${STATE[type].map(item=>`<tr>
          ${cols.map(c=>`<td>${renderVal(item,c[1])}</td>`).join('')}
          <td style="white-space:nowrap">
            <button class="btn btn-sm btn-blue" onclick="openCRUDEditModal('${type}','${singular}','${item.id}')">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="confirmDeleteCRUD('${type}','${item.id}','${singular}')">Del</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
</div>`;
}

function openCRUDModal(type, singular, id) {
  const item = id?STATE[type].find(x=>x.id===id):null;
  let body = '';
  if(type==='roles') {
    body = `
    <div class="form-group"><label class="form-label">Role Name</label><input class="form-input" id="crud_name" value="${item?item.name:''}"></div>
    <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="crud_desc" value="${item?item.description||'':''}"></div>
    <div class="form-group"><label class="form-label">Color</label><input class="form-input" id="crud_color" type="color" value="${item?item.color:'#c8ff57'}" style="height:38px;padding:3px 6px"></div>`;
  } else if(type==='industries') {
    body = `
    <div class="form-row"><div class="form-group"><label class="form-label">Name</label><input class="form-input" id="crud_name" value="${item?item.name:''}"></div>
    <div class="form-group"><label class="form-label">Code</label><input class="form-input" id="crud_code" value="${item?item.code||'':''}" maxlength="8" placeholder="e.g. IT"></div></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="crud_desc" rows="2">${item?item.description||'':''}</textarea></div>`;
  } else if(type==='sources') {
    body = `
    <div class="form-group"><label class="form-label">Source Name</label><input class="form-input" id="crud_name" value="${item?item.name:''}"></div>
    <div class="form-group"><label class="form-label">Supports Auto-fetch (AI Lead Discovery)?</label>
    <select class="form-select" id="crud_auto">
      <option value="true"${item&&item.isAutoFetch?' selected':''}>Yes — can be searched automatically</option>
      <option value="false"${item&&!item.isAutoFetch?' selected':''}>No — manual source only</option>
    </select></div>`;
  } else if(type==='products') {
    body = `
    <div class="form-row"><div class="form-group"><label class="form-label">Product Name</label><input class="form-input" id="crud_name" value="${item?item.name:''}"></div>
    <div class="form-group"><label class="form-label">Category</label>
    <select class="form-select" id="crud_cat">${['Software','Service','Support','Hardware','Consulting'].map(c=>`<option${item&&item.category===c?' selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Price (₹)</label><input class="form-input" id="crud_price" type="number" value="${item?item.price||0:0}"></div>
    <div class="form-group"><label class="form-label">Tax Percent (%)</label><input class="form-input" id="crud_tax" type="number" value="${item?item.taxPercent||18:18}" min="0" max="100"></div></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="crud_desc" rows="2">${item?item.description||'':''}</textarea></div>`;
  }
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveCRUDItem('${type}','${singular}','${id||''}')">💾 ${id?'Update':'Add'} ${singular}</button>`;
  openModal(`${id?'Edit':'Add'} ${singular}`, body, footer, 'sm');
}

function openCRUDEditModal(type, singular, id) { openCRUDModal(type, singular, id); }

function saveCRUDItem(type, singular, id) {
  const nameEl = document.getElementById('crud_name');
  if(!nameEl||!nameEl.value.trim()){showToast('Name is required','warning');return;}
  const base = {id:id||uid(), name:nameEl.value.trim()};
  if(type==='roles'){base.description=document.getElementById('crud_desc')?.value||'';base.color=document.getElementById('crud_color')?.value||'#c8ff57';}
  if(type==='industries'){base.code=document.getElementById('crud_code')?.value||'';base.description=document.getElementById('crud_desc')?.value||'';}
  if(type==='sources'){base.isAutoFetch=document.getElementById('crud_auto')?.value==='true';}
  if(type==='products'){base.category=document.getElementById('crud_cat')?.value||'Software';base.price=parseInt(document.getElementById('crud_price')?.value)||0;base.taxPercent=parseInt(document.getElementById('crud_tax')?.value)||18;base.description=document.getElementById('crud_desc')?.value||'';}
  if(id){const i=STATE[type].findIndex(x=>x.id===id);if(i>=0)STATE[type][i]={...STATE[type][i],...base};}
  else STATE[type].push(base);
  closeModal();
  const tbody = document.getElementById('crud_tbody_'+type);
  if(tbody) {
    const colMap = {roles:['Name:name','Description:description','Color:color'],industries:['Name:name','Code:code','Description:description'],sources:['Name:name','Auto-fetch:isAutoFetch'],products:['Name:name','Category:category','Price:price','Tax%:taxPercent']};
    document.getElementById('settingContent').innerHTML = renderCRUDTable(type, singular, colMap[type]||['Name:name']);
  }
  showToast(`${singular} ${id?'updated':'added'}!`);
}

function confirmDeleteCRUD(type, id, singular) {
  openModal('Confirm Delete',`<div style="text-align:center;padding:8px"><div style="font-size:32px;margin-bottom:10px">🗑</div><div style="font-size:13px;color:var(--text2)">Delete this ${singular||'item'} permanently?</div><div style="font-size:11px;color:var(--muted);margin-top:5px">This action cannot be undone</div></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="deleteCRUDItem('${type}','${id}','${singular||'Item'}')">🗑 Delete</button>`,'sm');
}

function deleteCRUDItem(type, id, singular) {
  STATE[type] = STATE[type].filter(x=>x.id!==id);
  closeModal();
  const colMap = {roles:['Name:name','Description:description','Color:color'],industries:['Name:name','Code:code','Description:description'],sources:['Name:name','Auto-fetch:isAutoFetch'],products:['Name:name','Category:category','Price:price','Tax%:taxPercent']};
  document.getElementById('settingContent').innerHTML = renderCRUDTable(type, singular||'Item', colMap[type]||['Name:name']);
  showToast('Deleted','error');
}

function renderUsersTable() {
  return `

  <div class="panel-header">
    <div class="panel-title">Users</div>
    <button class="btn btn-accent btn-sm" onclick="openUserModal()">+ Add User</button>

    <table class="tbl">

  </div>

function buildUsersRows() {
  return STATE.users.map(u=>`<tr>
    <td><div style="font-weight:500">${u.name}</div></td>
    <td><span class="badge badge-${u.role==='admin'?'won':u.role==='manager'?'open':'new'}">${u.role}</span></td>

    <td style="white-space:nowrap">
      <button class="btn btn-sm btn-blue" onclick="openUserModal('${u.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="confirmDeleteUser('${u.id}')">Del</button>
    </td>

}

function openUserModal(id) {
  const u = id?STATE.users.find(x=>x.id===id):null;
  const mgrOpts = '<option value="">— None —</option>'+STATE.users.filter(x=>x.role==='manager'||x.role==='admin').map(m=>`<option value="${m.id}"${u&&u.managerId===m.id?' selected':''}>${m.name}</option>`).join('');
  const body = `
  <div class="form-row"><div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="um_name" value="${u?u.name:''}"></div>
  <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="um_email" type="email" value="${u?u.email:''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Role</label>
  <select class="form-select" id="um_role">${STATE.roles.map(r=>`<option value="${r.name.toLowerCase()}"${u&&u.role===r.name.toLowerCase()?' selected':''}>${r.name}</option>`).join('')}</select></div>
  <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="um_phone" value="${u?u.phone||'':''}"></div></div>
  <div class="form-group"><label class="form-label">Reports To (Manager)</label><select class="form-select" id="um_mgr">${mgrOpts}</select></div>
  <div class="form-group"><label class="form-label">Status</label>
  <select class="form-select" id="um_active">
    <option value="true"${u&&u.is_active?' selected':''}>Active</option>
    <option value="false"${u&&!u.is_active?' selected':''}>Inactive</option>
  </select></div>`;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveUser('${id||''}')">💾 ${id?'Update':'Add'} User</button>`;
  openModal(id?'Edit User':'Add User', body, footer);
}

function saveUser(id) {
  const data = {id:id||uid(),name:document.getElementById('um_name').value,email:document.getElementById('um_email').value,role:document.getElementById('um_role').value,phone:document.getElementById('um_phone').value,managerId:document.getElementById('um_mgr').value||null,is_active:document.getElementById('um_active').value==='true',joiningDate:id?(STATE.users.find(u=>u.id===id)?.joiningDate||new Date().toISOString().slice(0,10)):new Date().toISOString().slice(0,10)};
  if(id){const i=STATE.users.findIndex(u=>u.id===id);if(i>=0)STATE.users[i]={...STATE.users[i],...data};}
  else STATE.users.push(data);
  closeModal();
  const tbody = document.getElementById('usersTableBody');
  if(tbody) tbody.innerHTML = buildUsersRows();
  showToast(id?'User updated':'User added');
}

function confirmDeleteUser(id) {
  openModal('Confirm Delete',`<div style="text-align:center;padding:8px"><div style="font-size:32px;margin-bottom:10px">🗑</div><div style="font-size:13px;color:var(--text2)">Delete this user permanently?</div></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="deleteUser('${id}')">🗑 Delete</button>`,'sm');
}

function deleteUser(id) {
  STATE.users = STATE.users.filter(u=>u.id!==id);
  closeModal();
  const tbody = document.getElementById('usersTableBody');
  if(tbody) tbody.innerHTML = buildUsersRows();
  showToast('User deleted','error');
}
