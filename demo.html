<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexCRM — Sales Intelligence Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Fraunces:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f;
  --bg2: #0d0e1a;
  --bg3: #141525;
  --bg4: #1c1d30;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #c8ff57;
  --accent2: #57d9ff;
  --accent3: #ff6b8a;
  --accent4: #a78bff;
  --text: #eeeef8;
  --text2: #b0b0c8;
  --muted: #5a5a78;
  --card: rgba(255,255,255,0.035);
  --card2: rgba(255,255,255,0.06);
  --success: #4fffb0;
  --warning: #ffc14a;
  --danger: #ff6b6b;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{font-size:13px;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'DM Mono',monospace;
  min-height:100vh;
  overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(200,255,87,0.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(200,255,87,0.018) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;z-index:0;
}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}

/* LAYOUT */
.app{display:flex;height:100vh;position:relative;z-index:1;}

/* LOGIN SCREEN */
#loginScreen{
  position:fixed;inset:0;z-index:1000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
}
.login-box{
  width:420px;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:40px;
  animation:fadeUp .5s ease;
}
.login-logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:28px;
  color:var(--accent);letter-spacing:-1px;margin-bottom:4px;
}
.login-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
.login-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;}
.login-input{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 12px;
  font-family:'DM Mono',monospace;font-size:13px;color:var(--text);
  outline:none;transition:border-color .2s;margin-bottom:16px;
}
.login-input:focus{border-color:var(--accent);}
.role-select{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px;
}
.role-btn{
  padding:10px 8px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);cursor:pointer;text-align:center;
  font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);
  transition:all .15s;
}
.role-btn.sel{background:rgba(200,255,87,0.1);border-color:var(--accent);color:var(--accent);}
.btn-login{
  width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--radius-sm);
  font-family:'Syne',sans-serif;font-weight:700;font-size:14px;color:#000;
  cursor:pointer;transition:all .15s;
}
.btn-login:hover{background:#d4ff6a;transform:translateY(-1px);}

/* SIDEBAR */
.sidebar{
  width:210px;flex-shrink:0;background:var(--bg2);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  height:100vh;overflow-y:auto;
}
.logo{padding:22px 18px 16px;border-bottom:1px solid var(--border);}
.logo-mark{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-.5px;}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
.role-indicator{
  margin-top:8px;display:inline-flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:20px;font-size:9px;font-weight:500;
  background:rgba(200,255,87,0.1);color:var(--accent);border:1px solid rgba(200,255,87,0.2);
}

.nav-wrap{padding:8px 10px;flex:1;}
.nav-section-label{
  font-size:9px;text-transform:uppercase;letter-spacing:2px;
  color:var(--muted);padding:10px 6px 5px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 8px;
  border-radius:var(--radius-sm);cursor:pointer;font-size:12px;color:var(--text2);
  transition:all .12s;margin-bottom:1px;user-select:none;
}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:rgba(200,255,87,0.1);color:var(--accent);}
.nav-item.hidden{display:none;}
.nav-icon{font-size:13px;width:16px;text-align:center;}
.nav-badge{
  margin-left:auto;padding:1px 5px;border-radius:20px;
  font-size:9px;font-weight:600;background:var(--accent3);color:#fff;
}
.nav-badge.green{background:var(--accent);color:#000;}

.sidebar-user{
  padding:12px 14px;border-top:1px solid var(--border);
  display:flex;align-items:center;gap:9px;cursor:pointer;
}
.user-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-family:'Syne',sans-serif;font-weight:700;font-size:11px;color:#000;flex-shrink:0;
}
.user-name{font-size:11px;font-weight:500;}
.user-role{font-size:9px;color:var(--muted);}
.logout-btn{margin-left:auto;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:4px;}
.logout-btn:hover{color:var(--accent3);}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* TOPBAR */
.topbar{
  padding:14px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  background:rgba(7,8,15,0.85);backdrop-filter:blur(12px);flex-shrink:0;
}
.page-title{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.search-box{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 12px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text);
  outline:none;width:180px;transition:border-color .2s;
}
.search-box:focus{border-color:var(--accent);}
.search-box::placeholder{color:var(--muted);}
.notif-btn{
  width:32px;height:32px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:14px;position:relative;
}
.notif-dot{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent3);border:1px solid var(--bg);}

/* CONTENT AREA */
.content-area{flex:1;overflow-y:auto;padding:24px 28px;}

/* BUTTONS */
.btn{
  padding:7px 14px;border-radius:var(--radius-sm);font-family:'DM Mono',monospace;
  font-size:12px;cursor:pointer;border:none;transition:all .12s;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
}
.btn-accent{background:var(--accent);color:#000;}
.btn-accent:hover{background:#d4ff6a;transform:translateY(-1px);}
.btn-ghost{background:var(--card);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);}
.btn-danger{background:rgba(255,107,107,0.15);color:var(--danger);border:1px solid rgba(255,107,107,0.2);}
.btn-danger:hover{background:rgba(255,107,107,0.25);}
.btn-sm{padding:4px 10px;font-size:11px;}
.btn-blue{background:rgba(87,217,255,0.1);color:var(--accent2);border:1px solid rgba(87,217,255,0.2);}
.btn-blue:hover{background:rgba(87,217,255,0.2);}
.btn-purple{background:rgba(167,139,255,0.1);color:var(--accent4);border:1px solid rgba(167,139,255,0.2);}
.btn-purple:hover{background:rgba(167,139,255,0.2);}

/* CARDS / PANELS */
.panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:18px;
  animation:fadeUp .4s ease both;
}
.panel-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.panel-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.panel-meta{font-size:10px;color:var(--muted);margin-left:auto;}
.panel-body{padding:18px;}
.panel-body.np{padding:0;}

/* GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.grid23{display:grid;grid-template-columns:2fr 1fr;gap:18px;}

/* KPI CARDS */
.kpi-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;
  animation:fadeUp .4s ease both;
}
.kpi-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--kc,var(--accent));}
.kpi-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;}
.kpi-value{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;line-height:1;}
.kpi-change{font-size:10px;margin-top:5px;}
.kpi-up{color:var(--success);}
.kpi-down{color:var(--accent3);}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);
  padding:10px 14px;text-align:left;font-weight:400;border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.tbl td{padding:11px 14px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.03);}
.tbl tbody tr{transition:background .1s;cursor:pointer;}
.tbl tbody tr:hover td{background:rgba(255,255,255,0.02);}
.tbl tbody tr:last-child td{border-bottom:none;}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;}
.badge-dot{width:5px;height:5px;border-radius:50%;}
.badge-hot{background:rgba(255,107,138,0.15);color:var(--accent3);}
.badge-warm{background:rgba(255,193,74,0.15);color:var(--warning);}
.badge-cold{background:rgba(87,217,255,0.1);color:var(--accent2);}
.badge-won{background:rgba(79,255,176,0.12);color:var(--success);}
.badge-lost{background:rgba(255,107,107,0.12);color:var(--danger);}
.badge-open{background:rgba(200,255,87,0.1);color:var(--accent);}
.badge-new{background:rgba(167,139,255,0.1);color:var(--accent4);}
.badge-pending{background:rgba(255,193,74,0.12);color:var(--warning);}
.badge-approved{background:rgba(79,255,176,0.12);color:var(--success);}

.stage-pill{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;
  border-radius:20px;font-size:10px;font-weight:500;
}

/* CHIP */
.ai-chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 8px;
  border-radius:20px;background:rgba(200,255,87,0.08);border:1px solid rgba(200,255,87,0.18);
  color:var(--accent);font-size:10px;font-weight:500;
}

/* FORM ELEMENTS */
.form-group{margin-bottom:14px;}
.form-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:5px;display:block;}
.form-input,.form-select,.form-textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--text);
  outline:none;transition:border-color .2s;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent);}
.form-select option{background:var(--bg3);}
.form-textarea{resize:vertical;min-height:80px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* MODAL */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);
  z-index:500;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-backdrop.open{opacity:1;pointer-events:all;}
.modal{
  background:var(--bg2);border:1px solid var(--border2);border-radius:14px;
  width:90%;max-width:620px;max-height:85vh;overflow-y:auto;
  transform:translateY(20px);transition:transform .2s;
  box-shadow:var(--shadow);
}
.modal-backdrop.open .modal{transform:translateY(0);}
.modal-lg{max-width:860px;}
.modal-sm{max-width:420px;}
.modal-header{
  padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;position:sticky;top:0;
  background:var(--bg2);z-index:1;
}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.modal-close{
  margin-left:auto;width:28px;height:28px;border-radius:6px;background:var(--card);
  border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:14px;color:var(--text2);transition:all .12s;
}
.modal-close:hover{color:var(--accent3);border-color:var(--accent3);}
.modal-body{padding:22px;}
.modal-footer{
  padding:14px 22px;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:8px;
  position:sticky;bottom:0;background:var(--bg2);
}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{
  padding:9px 16px;font-size:11px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .12s;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab:hover:not(.active){color:var(--text);}

/* TOGGLE */
.toggle-wrap{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.toggle-wrap:last-child{border:none;}
.toggle-label{font-size:12px;color:var(--text2);}
.toggle{
  width:38px;height:20px;border-radius:10px;background:var(--bg4);
  cursor:pointer;position:relative;transition:background .2s;border:1px solid var(--border);
}
.toggle.on{background:var(--accent);}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:14px;height:14px;border-radius:50%;background:#000;transition:left .2s;
}
.toggle.on::after{left:20px;background:#000;}

/* STAT ROW */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.stat-row:last-child{border:none;}
.stat-name{font-size:11px;color:var(--text2);}
.stat-val{font-family:'Syne',sans-serif;font-size:13px;font-weight:600;}

/* PROGRESS */
.prog-track{background:rgba(255,255,255,0.06);border-radius:3px;height:4px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .8s ease;}

/* PIPELINE VISUAL */
.pipeline-vis{display:flex;gap:0;height:44px;border-radius:8px;overflow:hidden;margin-bottom:12px;}
.p-stage{
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;font-size:9px;cursor:pointer;
  transition:filter .15s;
}
.p-stage:hover{filter:brightness(1.3);}

/* CHART BARS */
.chart-bars{display:flex;align-items:flex-end;gap:5px;height:80px;}
.cb-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.cb-fill{width:100%;border-radius:3px 3px 0 0;background:var(--accent);opacity:.7;cursor:pointer;transition:opacity .2s;}
.cb-fill:hover{opacity:1;}
.cb-label{font-size:9px;color:var(--muted);}

/* DONUT */
.donut-wrap{position:relative;width:90px;height:90px;margin:0 auto 10px;}
.donut-wrap svg{transform:rotate(-90deg);}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-pct{font-family:'Syne',sans-serif;font-size:17px;font-weight:800;}
.donut-sub{font-size:9px;color:var(--muted);}

/* LEGEND */
.legend{display:flex;flex-direction:column;gap:5px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* LIST ITEMS */
.list-item{
  display:flex;align-items:flex-start;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--border);
}
.list-item:last-child{border:none;padding-bottom:0;}
.li-icon{
  width:30px;height:30px;border-radius:7px;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;
}
.li-title{font-size:12px;font-weight:500;margin-bottom:2px;}
.li-meta{font-size:10px;color:var(--muted);}
.li-right{margin-left:auto;text-align:right;font-size:10px;color:var(--muted);white-space:nowrap;}

/* OCR DROP ZONE */
.ocr-zone{
  border:2px dashed var(--border2);border-radius:var(--radius);
  padding:28px;text-align:center;cursor:pointer;transition:all .2s;
  background:var(--bg3);
}
.ocr-zone:hover,.ocr-zone.drag{border-color:var(--accent);background:rgba(200,255,87,0.04);}
.ocr-icon{font-size:28px;margin-bottom:8px;}
.ocr-text{font-size:11px;color:var(--muted);}
.ocr-result{
  margin-top:14px;padding:14px;background:var(--bg4);border-radius:var(--radius-sm);
  border:1px solid var(--border);display:none;
}
.ocr-result.show{display:block;}
.ocr-field{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:11px;}
.ocr-field:last-child{border:none;}
.ocr-key{color:var(--muted);}
.ocr-val{color:var(--accent);font-weight:500;}

/* AI SEARCH */
.ai-search-panel{
  background:rgba(200,255,87,0.03);border:1px solid rgba(200,255,87,0.12);
  border-radius:var(--radius);padding:18px;margin-bottom:16px;
}
.ai-source-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.source-chip{
  padding:4px 10px;border-radius:20px;font-size:10px;cursor:pointer;
  background:var(--bg3);border:1px solid var(--border);color:var(--text2);transition:all .12s;
}
.source-chip.sel{background:rgba(200,255,87,0.1);border-color:var(--accent);color:var(--accent);}

.ai-lead-card{
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:14px;
  animation:fadeUp .3s ease both;
}
.al-score{
  width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:'Syne',sans-serif;
  font-weight:800;font-size:14px;flex-shrink:0;
}
.al-info{flex:1;}
.al-company{font-size:13px;font-weight:600;margin-bottom:3px;}
.al-meta{font-size:10px;color:var(--muted);}

/* EXPENSE STATS */
.expense-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}

/* SETTINGS CRUD */
.crud-list{display:flex;flex-direction:column;gap:6px;}
.crud-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);
}
.crud-item-name{flex:1;font-size:12px;}
.crud-item-meta{font-size:10px;color:var(--muted);}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:40px;color:var(--muted);
}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-text{font-size:12px;}

/* SEARCHING ANIMATION */
.searching{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:30px;color:var(--accent);font-size:12px;
}
.dot-pulse{display:flex;gap:4px;}
.dot-pulse span{
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:pulse 1.2s ease-in-out infinite;
}
.dot-pulse span:nth-child(2){animation-delay:.2s;}
.dot-pulse span:nth-child(3){animation-delay:.4s;}
@keyframes pulse{0%,60%,100%{transform:scale(.6);opacity:.4;}30%{transform:scale(1);opacity:1;}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes spin{to{transform:rotate(360deg);}}

/* PAGE */
.page{display:none;animation:fadeIn .25s ease;}
.page.active{display:block;}

/* TAGS INPUT */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;
  border-radius:20px;background:rgba(200,255,87,0.1);border:1px solid rgba(200,255,87,0.2);
  color:var(--accent);font-size:10px;
}
.tag-remove{cursor:pointer;opacity:.7;}
.tag-remove:hover{opacity:1;}

/* CONFIRM */
.confirm-box{text-align:center;padding:10px;}
.confirm-icon{font-size:36px;margin-bottom:12px;}
.confirm-msg{font-size:13px;color:var(--text2);margin-bottom:4px;}
.confirm-sub{font-size:11px;color:var(--muted);}

/* NOTIFICATION TOAST */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:12px 18px;font-size:12px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow);animation:fadeUp .3s ease;max-width:320px;
}
.toast-icon{font-size:16px;}

/* PIPELINE STAGES DETAIL */
.pipeline-stage-row{
  display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid var(--border);
}
.pipeline-stage-row:last-child{border:none;}
.ps-label{width:30px;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:var(--accent);}
.ps-bar-wrap{flex:1;}
.ps-bar{height:6px;border-radius:3px;transition:width .6s ease;}
.ps-count{font-size:11px;color:var(--muted);width:80px;text-align:right;}

/* DETAIL VIEW */
.detail-section{margin-bottom:20px;}
.detail-section-title{
  font-family:'Syne',sans-serif;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:1px;color:var(--muted);
  margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);
}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.detail-item{}
.detail-key{font-size:10px;color:var(--muted);margin-bottom:2px;}
.detail-val{font-size:12px;color:var(--text);}

/* ACTIVITY TIMELINE */
.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:1px;background:var(--border);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{
  position:absolute;left:-17px;top:3px;width:10px;height:10px;
  border-radius:50%;background:var(--accent);border:2px solid var(--bg2);
}
.tl-time{font-size:9px;color:var(--muted);margin-bottom:2px;}
.tl-text{font-size:11px;color:var(--text2);}

/* STATUS INDICATOR */
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;}

/* RESPONSIVE SCROLL FIX */
.scroll-x{overflow-x:auto;}

/* Deal Stage Colors */
.s-p1{background:rgba(90,90,160,0.3);}

// ========== LOGIN ==========
let selectedRole = 'admin';
function selectRole(el) {
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('sel'));
  el.classList.add('sel');
  selectedRole = el.dataset.role;
}
function doLogin() {
  const name = document.getElementById('loginName').value.trim() || 'User';
  currentUser = { name, role: selectedRole };
  currentRole = selectedRole;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  buildNav();
  updateUserDisplay();
  navigate('dashboard');
}
function doLogout() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainApp').style.display = 'none';
}
function updateUserDisplay() {
  const u = currentUser;
  const initials = u.name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = u.name;
  document.getElementById('userRoleLabel').textContent = u.role.charAt(0).toUpperCase()+u.role.slice(1);
  document.getElementById('roleIndicator').textContent = '◈ ' + u.role.charAt(0).toUpperCase()+u.role.slice(1);
}

// ========== NAV BUILD ==========
function buildNav() {
  const config = NAV_CONFIG[currentRole] || NAV_CONFIG.salesperson;
  let html = '';
  config.forEach(section => {
    html += `<div class="nav-section-label">${section.section}</div>`;
    section.items.forEach(item => {
      const badge = item.badge ? item.badge() : 0;
      const badgeHtml = badge > 0 ? `<span class="nav-badge ${item.badgeClass||''}">${badge}</span>` : '';
      html += `<div class="nav-item" data-page="${item.id}" onclick="navigate('${item.id}',this)">
        <span class="nav-icon">${item.icon}</span>${item.label}${badgeHtml}
      </div>`;
    });
  });
  document.getElementById('navWrap').innerHTML = html;
}
function refreshNav() { buildNav(); }

// ========== NAVIGATION ==========
function navigate(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  else { const found = document.querySelector(`[data-page="${page}"]`); if(found) found.classList.add('active'); }
  const titles = { dashboard:'Dashboard', forecast:'Sales Forecasting', deals:'Deals', leads:'Leads Management', quotations:'Quotations', clients:'Client Directory', ai_leads:'AI Generated Leads', followups:'Follow-ups', meetings:'Meetings', events:'Events', expenses:'Expenses', reports:'Reports', performance:'Team Performance', settings:'Settings' };
  document.getElementById('pageTitle').textContent = titles[page] || page;
  renderPage(page);
}

// ========== HELPERS ==========
function fmtMoney(n) { if(n>=10000000) return '₹'+( n/10000000).toFixed(2)+'Cr'; if(n>=100000) return '₹'+(n/100000).toFixed(1)+'L'; if(n>=1000) return '₹'+(n/1000).toFixed(0)+'K'; return '₹'+n; }
function fmtDate(d) { if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function getUser(id) { return STATE.users.find(u=>u.id===id)||{name:'Unknown'}; }
function getIndustry(id) { return STATE.industries.find(i=>i.id===id)||{name:id}; }
function getSource(id) { return STATE.sources.find(s=>s.id===id)||{name:id}; }
function getClient(id) { return STATE.clients.find(c=>c.id===id)||{name:'Unknown'}; }
function riskColor(r) { return r==='low'?'var(--success)':r==='medium'?'var(--warning)':'var(--danger)'; }
function stageColor(s) { const m={P1:'#6a6acc',P2:'#5aaab0',P3:'#4ac8a0',P4:'#90cc50',P5:'#c0d840',P6:'#d8e830',P7:'var(--accent)'}; return m[s]||'var(--muted)'; }
function stageBg(s) { const m={P1:'rgba(106,106,204,0.2)',P2:'rgba(90,170,176,0.2)',P3:'rgba(74,200,160,0.2)',P4:'rgba(144,204,80,0.2)',P5:'rgba(192,216,64,0.2)',P6:'rgba(216,232,48,0.2)',P7:'rgba(200,255,87,0.25)'}; return m[s]||'rgba(255,255,255,0.05)'; }
function uid() { return 'id_'+Math.random().toString(36).slice(2,10); }
function showToast(msg, type='success') {
  const icons = { success:'✓', error:'✕', info:'ℹ', warning:'⚠' };
  const colors = { success:'var(--success)', error:'var(--danger)', info:'var(--accent2)', warning:'var(--warning)' };
  const t = document.getElementById('toast');
  t.innerHTML = `<span class="toast-icon" style="color:${colors[type]}">${icons[type]}</span>${msg}`;
  t.style.display = 'flex';
  t.style.borderColor = colors[type]+'44';
  setTimeout(()=>{ t.style.display='none'; }, 2800);
}

// ========== MODAL ==========
function openModal(title, bodyHtml, footerHtml='', size='') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const footer = document.getElementById('modalFooter');
  if(footerHtml) { footer.innerHTML = footerHtml; footer.style.display='flex'; }
  else { footer.style.display='none'; }
  const modal = document.getElementById('modal');
  modal.className = 'modal'+(size?' modal-'+size:'');
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
function closeModalOnBackdrop(e) { if(e.target===document.getElementById('modalBackdrop')) closeModal(); }

// ========== RENDER ENGINE ==========
function renderPage(page) {
  const ca = document.getElementById('contentArea');
  const renderers = {
    dashboard: renderDashboard,
    forecast: renderForecast,
    deals: renderDeals,
    leads: renderLeads,
    clients: renderClients,
    ai_leads: renderAILeads,
    followups: renderFollowups,
    meetings: renderMeetings,
    events: renderEvents,
    expenses: renderExpenses,
    quotations: renderQuotations,
    reports: renderReports,
    performance: renderPerformance,
    settings: renderSettings,
  };
  if(renderers[page]) { ca.innerHTML = renderers[page](); }
  else { ca.innerHTML = `<div class="empty-state"><div class="empty-icon">🚧</div><div class="empty-text">Page under construction</div></div>`; }
  // Run post-render hooks
  if(page==='settings') bindSettingToggles();
}

function convertLeadToDeal(leadId) {
  const l = STATE.leads.find(x=>x.id===leadId);
  if(!l) return;
  // Create client if not exists
  let clientId = STATE.clients.find(c=>c.name===l.company)?.id;
  if(!clientId) {
    clientId = uid();
    STATE.clients.push({
      id: clientId, name: l.company, industry: l.industry,
      address: l.address||'', employees: l.employees||0,
      turnover: l.turnover||'N/A', website: l.website||'', source: l.source,
      dealCount: 0, gst: '', location: '', createdBy: STATE.users[0].id, createdAt: new Date().toISOString().slice(0,10),
    });
    showToast(`${l.company} added to Clients`);
  }
  // Create deal
  const dealId = uid();
  STATE.deals.push({
    id: dealId, client: clientId, clientName: l.company,
    assignedTo: l.assignedTo, stage: 'P1', value: l.estimatedValue,
    probability: 20, expectedClose: '', actualClose: null,
    status: 'open', aiRisk: 'medium', leadId, createdAt: new Date().toISOString().slice(0,10),
  });
  l.convertedToDeal = true; l.status = 'converted';
  closeModal(); showToast(`Lead converted to Deal! Company added as Client.`,'success');
  renderPage('leads'); refreshNav();
}

function openOCRModal(context) {
  const sampleData = context==='lead' 
    ? { company:'Infosys BPM Ltd', industry:'IT/SaaS', contact:'Vikram Nair', phone:'+91 98765 43210', email:'vikram.nair@infosys.com', website:'infosysbpm.com', address:'Electronic City, Bangalore' }
    : { vendor:'The Oberoi Mumbai', date:'2025-03-18', amount:'8,500', gst:'1,530', total:'10,030', category:'Client Meeting' };

  const body = `
  <div class="ocr-zone" id="ocrZone" onclick="simulateOCR('${context}')">
    <div class="ocr-icon">📄</div>
    <div style="font-size:13px;font-weight:500;margin-bottom:4px">Drop file or click to upload</div>
    <div class="ocr-text">Supports: Business card, receipt, document (JPG, PNG, PDF)</div>
    <div style="margin-top:10px"><span class="ai-chip">✦ AI OCR Processing</span></div>
  </div>
  <div class="ocr-result" id="ocrResult">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <span style="color:var(--success);font-size:14px">✓</span>
      <span style="font-size:11px;color:var(--text2)">OCR Extraction Complete — Review and confirm</span>
    </div>
    ${Object.entries(sampleData).map(([k,v])=>`
    <div class="ocr-field">
      <span class="ocr-key">${k.charAt(0).toUpperCase()+k.slice(1)}</span>
      <span class="ocr-val">${v}</span>
    </div>`).join('')}
  </div>
  <div id="ocrProcessing" style="display:none">
    <div class="searching"><div class="dot-pulse"><span></span><span></span><span></span></div>Processing document with AI OCR...</div>
  </div>`;
  const footer = `
    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-accent" id="ocrImportBtn" style="display:none" onclick="importOCRData('${context}')">Import ${context==='lead'?'as Lead':'Expense'}</button>`;
  openModal(context==='lead'?'📷 OCR Lead Import':'📷 OCR Expense Import', body, footer);
}
function simulateOCR(context) {
  document.getElementById('ocrZone').style.display='none';
  document.getElementById('ocrProcessing').style.display='block';
  setTimeout(()=>{
    document.getElementById('ocrProcessing').style.display='none';
    document.getElementById('ocrResult').classList.add('show');
    document.getElementById('ocrImportBtn').style.display='inline-flex';
  }, 1800);
}
function importOCRData(context) {
  if(context==='lead') {
    STATE.leads.push({ id:uid(), company:'Infosys BPM Ltd', industry:'i1', employees:50000, turnover:'₹5000Cr+', address:'Electronic City, Bangalore', source:'s1', temperature:'warm', estimatedValue:2000000, assignedTo:'u2', status:'new', convertedToDeal:false, lastContact:new Date().toISOString().slice(0,10), nextAction:'Initial contact', createdAt:new Date().toISOString().slice(0,10) });
    showToast('Lead imported from OCR!');
  } else {
    STATE.expenses.push({ id:uid(), userId:currentUser.name==='Rahul Kumar'?'u1':'u2', type:'deal', category:'client_meeting', amount:8500, gst:1530, total:10030, date:new Date().toISOString().slice(0,10), description:'Client meeting expense (OCR)', status:'pending', approvedBy:null, receipt:{ vendor:'The Oberoi Mumbai', amount:8500, gst:1530 } });
    showToast('Expense imported from OCR!');
  }
  closeModal(); renderPage(context==='lead'?'leads':'expenses'); refreshNav();
}

      <div class="stat-row"><span class="stat-name">Feb Pipeline Analysis</span><button class="btn btn-sm btn-ghost" onclick="showToast('Downloading...','info')">📥 Excel</button></div>
      <div class="stat-row"><span class="stat-name">Team Activity — Mar</span><button class="btn btn-sm btn-ghost" onclick="showToast('Downloading...','info')">📥 PDF</button></div>

function selectFmt(el) { el.parentElement.querySelectorAll('.btn').forEach(b=>b.className='btn btn-sm btn-ghost'); el.className='btn btn-sm btn-accent'; }
function generateReport() {
  showToast('Report generating... Check Recent Reports in 30s','info');
}

  if(currentRole !== 'admin') {
    return `<div class="empty-state"><div class="empty-icon">🔒</div><div class="empty-text">Settings are only accessible to Admins</div></div>`;
  }
  return `
<div class="grid2" style="margin-bottom:18px">
  <!-- ROLES CRUD -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Roles</div>
      <button class="btn btn-accent btn-sm" onclick="openCRUDModal('role')">+ Add Role</button>
    </div>
    <div class="panel-body">
      <div class="crud-list" id="rolesList">${renderCRUDList('roles')}</div>
    </div>
  </div>
  <!-- INDUSTRIES CRUD -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Industries</div>
      <button class="btn btn-accent btn-sm" onclick="openCRUDModal('industry')">+ Add Industry</button>
    </div>
    <div class="panel-body">
      <div class="crud-list" id="industriesList">${renderCRUDList('industries')}</div>
    </div>
  </div>
</div>

<div class="grid2" style="margin-bottom:18px">
  <!-- SOURCES CRUD -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Lead Sources</div>
      <button class="btn btn-accent btn-sm" onclick="openCRUDModal('source')">+ Add Source</button>
    </div>
    <div class="panel-body">
      <div class="crud-list" id="sourcesList">${renderCRUDList('sources')}</div>
    </div>
  </div>
  <!-- PRODUCTS CRUD -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Products</div>
      <button class="btn btn-accent btn-sm" onclick="openCRUDModal('product')">+ Add Product</button>
    </div>
    <div class="panel-body">

    </div>
  </div>
</div>

<div class="grid2">
  <!-- CRM SETTINGS -->
  <div class="panel">
    <div class="panel-header"><div class="panel-title">CRM Integrations & Settings</div></div>
    <div class="panel-body">
      ${[
        ['Smart Follow-up Reminders','smartFollowup'],
        ['AI Lead Scoring','aiLeadScoring'],
        ['Predictive Analytics','predictiveAnalytics'],
        ['In-App Reminders','reminderInApp'],
        ['Email Reminders','reminderEmail'],
        ['WhatsApp Reminders','reminderWhatsapp'],
        ['Gmail Connected','gmailConnected'],
        ['Google Calendar','calendarConnected'],
        ['WhatsApp Business','whatsappConnected'],
      ].map(([label,key])=>`
      <div class="toggle-wrap">
        <span class="toggle-label">${label}</span>
        <div class="toggle ${STATE.crmSettings[key]?'on':''}" data-key="${key}" onclick="toggleSetting(this)"></div>

  <!-- USERS -->

    <div class="panel-header">
      <div class="panel-title">Users</div>

      <table class="tbl">
        <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="usersTable">
          ${renderUsersTable()}

function renderCRUDList(type) {
  const items = STATE[type];
  if(!items||!items.length) return '<div style="color:var(--muted);font-size:11px;text-align:center;padding:10px">No items</div>';
  return items.map(item=>{
    const name = item.name;
    const meta = type==='roles'?item.description:type==='industries'?item.code:type==='sources'?`Auto-fetch: ${item.isAutoFetch?'Yes':'No'}`:type==='products'?`${item.category} · ${fmtMoney(item.price)}`:'';
    const color = item.color||'var(--muted)';
    return `<div class="crud-item">
      ${type==='roles'?`<div style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></div>`:''}
      <div class="crud-item-name">${name}</div>
      <div class="crud-item-meta">${meta}</div>
      <button class="btn btn-sm btn-blue" onclick="openCRUDEditModal('${type}','${item.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="deleteCRUDItem('${type}','${item.id}')">Del</button>
    </div>`;
  }).join('');
}
function renderUsersTable() {
  return STATE.users.map(u=>`<tr>
    <td>${u.name}</td>
    <td><span class="badge badge-${u.role==='admin'?'won':u.role==='manager'?'open':'pending'}">${u.role}</span></td>
    <td><span style="color:${u.is_active?'var(--success)':'var(--muted)'}">${u.is_active?'Active':'Inactive'}</span></td>
    <td style="white-space:nowrap">
      <button class="btn btn-sm btn-blue" onclick="openUserModal('${u.id}')">Edit</button>
      <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">Del</button>
    </td>
  </tr>`).join('');
}

function bindSettingToggles() {
  document.querySelectorAll('.toggle').forEach(t=>{
    t.addEventListener('click',function(){
      const key=this.dataset.key;
      STATE.crmSettings[key]=!STATE.crmSettings[key];
      this.classList.toggle('on');
      showToast(`${key} ${STATE.crmSettings[key]?'enabled':'disabled'}`);
    });
  });
}
function toggleSetting(el) {/* handled by bindSettingToggles */}

function openCRUDModal(type) {
  const titles={role:'Role',industry:'Industry',source:'Lead Source',product:'Product'};
  const body = type==='role'?`
    <div class="form-group"><label class="form-label">Role Name</label><input class="form-input" id="crud_name" placeholder="e.g. Regional Manager"></div>
    <div class="form-group"><label class="form-label">Description</label><input class="form-input" id="crud_desc" placeholder="Brief description"></div>
    <div class="form-group"><label class="form-label">Color</label><input class="form-input" id="crud_color" type="color" value="#c8ff57"></div>
  `:type==='industry'?`
    <div class="form-group"><label class="form-label">Industry Name</label><input class="form-input" id="crud_name" placeholder="e.g. Fintech"></div>
    <div class="form-group"><label class="form-label">Code</label><input class="form-input" id="crud_code" placeholder="e.g. FIN"></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="crud_desc" rows="2"></textarea></div>
  `:type==='source'?`
    <div class="form-group"><label class="form-label">Source Name</label><input class="form-input" id="crud_name" placeholder="e.g. Twitter"></div>
    <div class="form-group"><label class="form-label">Auto-fetch Supported</label><select class="form-select" id="crud_auto">
      <option value="true">Yes</option><option value="false">No</option>
    </select></div>
  `:`
    <div class="form-row"><div class="form-group"><label class="form-label">Product Name</label><input class="form-input" id="crud_name" placeholder="e.g. Premium Suite"></div>
    <div class="form-group"><label class="form-label">Category</label><select class="form-select" id="crud_cat">
      ${['Software','Service','Support','Hardware'].map(c=>`<option>${c}</option>`).join('')}
    </select></div></div>
    <div class="form-row"><div class="form-group"><label class="form-label">Price (₹)</label><input class="form-input" id="crud_price" type="number"></div>
    <div class="form-group"><label class="form-label">Tax (%)</label><input class="form-input" id="crud_tax" type="number" value="18"></div></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="crud_desc" rows="2"></textarea></div>
  `;
  const footer=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveCRUDItem('${type}','')">💾 Add ${titles[type]}</button>`;
  openModal(`Add ${titles[type]}`,body,footer);
}
function openCRUDEditModal(type,id) {
  const map={roles:'role',industries:'industry',sources:'source',products:'product'};
  openCRUDModal(map[type]);
  // Pre-fill
  const items = STATE[type];
  const item = items.find(x=>x.id===id);
  if(!item) return;
  setTimeout(()=>{
    if(document.getElementById('crud_name')) document.getElementById('crud_name').value=item.name||'';
    if(document.getElementById('crud_desc')) document.getElementById('crud_desc').value=item.description||'';
    if(document.getElementById('crud_code')) document.getElementById('crud_code').value=item.code||'';
    if(document.getElementById('crud_color')) document.getElementById('crud_color').value=item.color||'#c8ff57';
    if(document.getElementById('crud_price')) document.getElementById('crud_price').value=item.price||0;
    if(document.getElementById('crud_tax')) document.getElementById('crud_tax').value=item.taxPercent||18;
    if(document.getElementById('crud_cat')) document.getElementById('crud_cat').value=item.category||'Software';
    if(document.getElementById('crud_auto')) document.getElementById('crud_auto').value=item.isAutoFetch?'true':'false';
    // Update footer button
    document.querySelector('.modal-footer .btn-accent').onclick = ()=>saveCRUDItem(map[type],id);
    document.querySelector('.modal-footer .btn-accent').textContent = '💾 Update';
    document.getElementById('modalTitle').textContent = 'Edit '+type.slice(0,-1);
  }, 50);
}
function saveCRUDItem(type,id) {
  const stateKey={role:'roles',industry:'industries',source:'sources',product:'products'}[type];
  const nameEl=document.getElementById('crud_name');
  if(!nameEl||!nameEl.value.trim()) { showToast('Name is required','warning'); return; }
  const data={id:id||uid(), name:nameEl.value.trim()};
  if(type==='role'){data.description=document.getElementById('crud_desc')?.value||'';data.color=document.getElementById('crud_color')?.value||'#c8ff57';}
  if(type==='industry'){data.code=document.getElementById('crud_code')?.value||'';data.description=document.getElementById('crud_desc')?.value||'';}
  if(type==='source'){data.isAutoFetch=document.getElementById('crud_auto')?.value==='true';}
  if(type==='product'){data.category=document.getElementById('crud_cat')?.value||'Software';data.price=parseInt(document.getElementById('crud_price')?.value)||0;data.taxPercent=parseInt(document.getElementById('crud_tax')?.value)||18;data.description=document.getElementById('crud_desc')?.value||'';}
  if(id){const i=STATE[stateKey].findIndex(x=>x.id===id);if(i>=0)STATE[stateKey][i]={...STATE[stateKey][i],...data};}
  else{STATE[stateKey].push(data);}
  closeModal();renderPage('settings');showToast(`${type.charAt(0).toUpperCase()+type.slice(1)} saved`);
}
function deleteCRUDItem(type,id) {
  STATE[type]=STATE[type].filter(x=>x.id!==id);
  const listId={roles:'rolesList',industries:'industriesList',sources:'sourcesList',products:'productsList'}[type];
  if(listId) document.getElementById(listId).innerHTML=renderCRUDList(type);
  showToast('Item deleted','error');
}
function openUserModal(id) {
  const u=id?STATE.users.find(x=>x.id===id):null;
  const body=`
  <div class="form-row"><div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="um_name" value="${u?u.name:''}"></div>
  <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="um_email" type="email" value="${u?u.email:''}"></div></div>
  <div class="form-row"><div class="form-group"><label class="form-label">Role</label><select class="form-select" id="um_role">
    ${STATE.roles.map(r=>`<option value="${r.name.toLowerCase()}" ${u&&u.role===r.name.toLowerCase()?'selected':''}>${r.name}</option>`).join('')}
  </select></div>
  <div class="form-group"><label class="form-label">Phone</label><input class="form-input" id="um_phone" value="${u?u.phone:''}"></div></div>
  <div class="form-group"><label class="form-label">Status</label><select class="form-select" id="um_active">
    <option value="true" ${u&&u.is_active?'selected':''}>Active</option>
    <option value="false" ${u&&!u.is_active?'selected':''}>Inactive</option>
  </select></div>`;
  const footer=`<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="saveUser('${id||''}')">💾 ${id?'Update':'Add'} User</button>`;
  openModal(id?'Edit User':'Add User',body,footer);
}
function saveUser(id) {
  const data={id:id||uid(), name:document.getElementById('um_name').value, email:document.getElementById('um_email').value, role:document.getElementById('um_role').value, phone:document.getElementById('um_phone').value, is_active:document.getElementById('um_active').value==='true', joiningDate:new Date().toISOString().slice(0,10) };
  if(id){const i=STATE.users.findIndex(u=>u.id===id);if(i>=0)STATE.users[i]={...STATE.users[i],...data};showToast('User updated');}
  else{STATE.users.push(data);showToast('User created');}
  closeModal();renderPage('settings');
}
function deleteUser(id) {
  if(STATE.users.length<=1){showToast('Cannot delete last user','error');return;}
  STATE.users=STATE.users.filter(u=>u.id!==id);
  document.getElementById('usersTable').innerHTML=renderUsersTable();
  showToast('User deleted','error');
}

// ========== KEYBOARD SHORTCUT ==========
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeModal();
});

console.log('%cNexCRM Loaded ✓', 'color:#c8ff57;font-weight:bold;font-size:16px;');
</script>
